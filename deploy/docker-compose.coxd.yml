# coxd on the NAS — always-on supervisor (DESIGN-V35 D20).
# Build context is the coxswain repo root. Deploy: see deploy/README.md.
services:
  coxd:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: coxd:latest
    container_name: coxd
    restart: unless-stopped
    # No host port publish: the board is reachable ONLY through Traefik
    # (coxd.home.manikantar.com). Publishing 8791 on the NAS bypassed Traefik entirely.
    # Ops from the NAS shell: `docker exec coxd curl -s localhost:8791/api/tasks`.
    environment:
      # gh + git use this. A PAT (repo scope) or a fine-grained token for the target repos.
      GH_TOKEN: ${GH_TOKEN:?set GH_TOKEN in deploy/.env}
      COXD_HOME: /data/coxswain
      COXD_REPO_ROOT: /repo
      # Task worktrees live OUTSIDE COXD_HOME (store/registry/markers), so a worker's
      # relative paths can't reach them. Existing tasks keep their old paths.
      COXD_WORKTREES: /work
      # Board header chip + (later) notification prefix; the Mac backup sets "mac".
      COXD_HOST_LABEL: nas
      COXD_ROLE: primary
      # Declares this isolated, LAN-only container as a sandbox so the claude CLI will
      # run headless as the container's root user. Without it, worker dispatch fails at
      # startup with "Fatal error in message reader". Safe here: the container is isolated.
      IS_SANDBOX: "1"
      # Household time: quiet hours (silent pings 22:00-07:15), the 07:20 morning
      # summary and "resumes ~HH:MM" are all local. tzdata is in the image.
      TZ: America/New_York
      COXD_TZ: America/New_York
      COXD_BIND: "0.0.0.0"   # inside the container only; Traefik reaches it on traefik-public
      # Commit identity for worker commits (nothing sets user.name/email in the image).
      # Fictional/bot identity only — never a real person's name (privacy rule).
      GIT_AUTHOR_NAME: ${COXD_GIT_NAME:-coxd-nas}
      GIT_AUTHOR_EMAIL: ${COXD_GIT_EMAIL:-coxd-nas@users.noreply.github.com}
      GIT_COMMITTER_NAME: ${COXD_GIT_NAME:-coxd-nas}
      GIT_COMMITTER_EMAIL: ${COXD_GIT_EMAIL:-coxd-nas@users.noreply.github.com}
      # optional AFK pings (leave blank to no-op)
      COXD_NTFY_TOPIC: ${COXD_NTFY_TOPIC:-}
      COXD_NTFY_SERVER: ${COXD_NTFY_SERVER:-}
      COXD_TG_TOKEN: ${COXD_TG_TOKEN:-}
      COXD_TG_CHAT: ${COXD_TG_CHAT:-}
      COXD_BOARD_URL: ${COXD_BOARD_URL:-}
    volumes:
      - coxd-data:/data/coxswain     # sqlite store + per-repo registry (persistent)
      - claude-creds:/root/.claude   # `claude login` writes the Pro-subscription creds here
      - coxd-repos:/repo             # target repos, cloned in during setup (persistent)
      - coxd-work:/work              # per-task git worktrees (+ node_modules), disposable
      # Deploy button (D-deploy): coxd drives the host Docker to build+recreate a
      # repo's containers, and needs the repos' live build path visible at the same
      # path the compose files use. ⚠ docker.sock is root-equivalent on the NAS —
      # LAN-only, human-gated (only acts on a board tap). Consistent with Traefik/
      # Homepage, which already mount it.
      - /var/run/docker.sock:/var/run/docker.sock
      - /volume1/docker:/volume1/docker
    networks:
      - traefik-public               # so Traefik (10.140.1.3) can reach the board
    labels:
      # LAN-only board behind Traefik. v1 = NO auth (home network); wildcard cert
      # covers *.home.manikantar.com, AdGuard resolves it internally to Traefik.
      - 'traefik.enable=true'
      - 'traefik.http.routers.coxd.rule=Host(`coxd.home.manikantar.com`)'
      - 'traefik.http.routers.coxd.entrypoints=websecure'
      - 'traefik.http.routers.coxd.tls=true'
      - 'traefik.http.services.coxd.loadbalancer.server.port=8791'
      # Homepage dashboard auto-discovery
      - 'homepage.group=Applications'
      - 'homepage.name=coxd'
      - 'homepage.icon=mdi-ship-wheel'
      - 'homepage.href=https://coxd.home.manikantar.com'
      - 'homepage.description=Autonomous coding orchestrator (coxswain)'

volumes:
  coxd-data:
  claude-creds:
  coxd-repos:
  coxd-work:

networks:
  traefik-public:
    external: true
