# coxd on the NAS — always-on supervisor (DESIGN-V35 D20).
# Build context is the coxswain repo root. Deploy: see deploy/README.md.
services:
  coxd:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: coxd:latest
    container_name: coxd
    restart: unless-stopped
    # No host port publish: the board is reachable ONLY through Traefik
    # (coxd.home.manikantar.com). Publishing 8791 on the NAS bypassed Traefik entirely.
    # Ops from the NAS shell: `docker exec coxd curl -s localhost:8791/api/tasks`.
    environment:
      # gh + git use this. A PAT (repo scope) or a fine-grained token for the target repos.
      GH_TOKEN: ${GH_TOKEN:?set GH_TOKEN in deploy/.env}
      COXD_HOME: /data/coxswain
      COXD_REPO_ROOT: /repo
      # Task worktrees live OUTSIDE COXD_HOME (store/registry/markers), so a worker's
      # relative paths can't reach them. Existing tasks keep their old paths.
      COXD_WORKTREES: /work
      # Board header chip + (later) notification prefix; the Mac backup sets "mac".
      COXD_HOST_LABEL: nas
      COXD_ROLE: primary
      COXD_CONCURRENCY: ${COXD_CONCURRENCY:-1}   # global cap; one Claude subscription
      # Declares this isolated, LAN-only container as a sandbox so the claude CLI will
      # run headless as the container's root user. Without it, worker dispatch fails at
      # startup with "Fatal error in message reader". Safe here: the container is isolated.
      IS_SANDBOX: "1"
      # Household time: quiet hours (silent pings 22:00-07:15), the 07:20 morning
      # summary and "resumes ~HH:MM" are all local. tzdata is in the image.
      TZ: America/New_York
      COXD_TZ: America/New_York
      COXD_BIND: "0.0.0.0"   # inside the container only; Traefik reaches it on traefik-public
      # Commit identity for worker commits (nothing sets user.name/email in the image).
      # Fictional/bot identity only — never a real person's name (privacy rule).
      GIT_AUTHOR_NAME: ${COXD_GIT_NAME:-coxd-nas}
      GIT_AUTHOR_EMAIL: ${COXD_GIT_EMAIL:-coxd-nas@users.noreply.github.com}
      GIT_COMMITTER_NAME: ${COXD_GIT_NAME:-coxd-nas}
      GIT_COMMITTER_EMAIL: ${COXD_GIT_EMAIL:-coxd-nas@users.noreply.github.com}
      # optional AFK pings (leave blank to no-op)
      COXD_NTFY_TOPIC: ${COXD_NTFY_TOPIC:-}
      COXD_NTFY_SERVER: ${COXD_NTFY_SERVER:-}
      COXD_TG_TOKEN: ${COXD_TG_TOKEN:-}
      COXD_TG_CHAT: ${COXD_TG_CHAT:-}
      COXD_BOARD_URL: ${COXD_BOARD_URL:-}
      # deployer API, e.g. http://deployer:8792; unset = board Deploy disabled (see "Deployer" in deploy/README.md); token must equal DEPLOYER_TOKEN
      COXD_DEPLOYER_URL: ${COXD_DEPLOYER_URL:-}
      COXD_DEPLOYER_TOKEN: ${COXD_DEPLOYER_TOKEN:-}
      # Owner login for board writes (see "Owner login" in deploy/README.md); unset = off
      COXD_OWNER_USER: ${COXD_OWNER_USER:-}
      COXD_PROXY_SECRET: ${COXD_PROXY_SECRET:-}
    volumes:
      - coxd-data:/data/coxswain     # sqlite store + per-repo registry (persistent)
      - claude-creds:/home/coxw/.claude   # `claude login` (as coxw) writes the Pro-subscription creds here
      - coxd-repos:/repo             # target repos, cloned in during setup (persistent)
      - coxd-work:/work              # per-task git worktrees (+ node_modules), disposable
      # No docker.sock and no /volume1/docker: both are root-equivalent on the NAS and
      # every app's .env lives under /volume1/docker. The board's Deploy button calls the separate deployer container below; it works once the
      # deployer is running and COXD_DEPLOYER_TOKEN matches its DEPLOYER_TOKEN.
    networks:
      - traefik-public               # so Traefik (10.140.1.3) can reach the board
      - coxd-proxy                   # private net shared only with Traefik
      - deployer-internal            # coxd -> http://deployer:8792
    labels:
      # LAN-only board behind Traefik. v1 = NO auth (home network); wildcard cert
      # covers *.home.manikantar.com, AdGuard resolves it internally to Traefik.
      - 'traefik.enable=true'
      - 'traefik.http.routers.coxd.rule=Host(`coxd.home.manikantar.com`)'
      - 'traefik.http.routers.coxd.entrypoints=websecure'
      - 'traefik.http.routers.coxd.tls=true'
      - 'traefik.http.services.coxd.loadbalancer.server.port=8791'
      # Traefik reaches coxd on this private net, not traefik-public
      - 'traefik.docker.network=coxd-proxy'
      # Forward-auth middleware (e.g. authelia@docker); empty = no auth. Covers the whole host.
      - 'traefik.http.routers.coxd.middlewares=${COXD_AUTH_MIDDLEWARE:-}'
      # Homepage dashboard auto-discovery
      - 'homepage.group=Applications'
      - 'homepage.name=coxd'
      - 'homepage.icon=mdi-ship-wheel'
      - 'homepage.href=https://coxd.home.manikantar.com'
      - 'homepage.description=Autonomous coding orchestrator (coxswain)'

  # The ONLY service with docker.sock. Reachable only from coxd over the internal
  # network (no ports published, not on traefik-public). Token + allowlist live in
  # NAS-only files (deploy/deployer.env, deploy/deployer/allowlist.json) - never in git.
  deployer:
    build:
      context: ..
      dockerfile: deploy/deployer/Dockerfile
    image: coxd-deployer:latest
    container_name: coxd-deployer
    profiles: ["deployer"]           # opt-in: plain `docker compose up -d` never starts it
    restart: on-failure:3            # a config error exits 78 with a log line; don't loop forever
    env_file:
      - path: deployer.env           # DEPLOYER_TOKEN=... (NAS only)
        required: false
    environment:
      DEPLOYER_CONFIG: /etc/deployer/allowlist.json
      DEPLOYER_SRC_ROOT: ${DEPLOYER_SRC_ROOT:-/volume1/docker}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Same path inside as on the host, so relative binds in target compose files
      # resolve correctly on the host daemon.
      - ${DEPLOYER_SRC_ROOT:-/volume1/docker}:${DEPLOYER_SRC_ROOT:-/volume1/docker}
      - ./deployer/allowlist.json:/etc/deployer/allowlist.json:ro
    networks:
      - deployer-internal

volumes:
  coxd-data:
  claude-creds:
  coxd-repos:
  coxd-work:

networks:
  traefik-public:
    external: true
  coxd-proxy:
    external: true                   # `docker network create coxd-proxy`; attach Traefik too
  deployer-internal:
    internal: true                   # no egress, no host publish
